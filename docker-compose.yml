services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: /srv/fasa-data/data/ipac/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      IPAC_SEED_ADMIN_USERNAME: ${IPAC_SEED_ADMIN_USERNAME}
      IPAC_SEED_ADMIN_PASSWORD: ${IPAC_SEED_ADMIN_PASSWORD}
      IPAC_RUN_SEED: "0"
      IPAC_AI_ENABLED: ${IPAC_AI_ENABLED:-0}
      IPAC_AI_PROVIDER: ${IPAC_AI_PROVIDER:-minimax}
      IPAC_AI_API_KEY: ${IPAC_AI_API_KEY:-}
      IPAC_AI_MODEL: ${IPAC_AI_MODEL:-MiniMax-M3}
      IPAC_AI_BASE_URL: ${IPAC_AI_BASE_URL:-https://api.minimax.io/v1/chat/completions}
      IPAC_AI_TIMEOUT_SECONDS: ${IPAC_AI_TIMEOUT_SECONDS:-30}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-IPAC <no-reply@localhost>}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - type: bind
        source: /srv/fasa-data/data/ipac/media
        target: /app/media
    command: >
      sh -c "python manage.py migrate
      && if [ \"$$IPAC_RUN_SEED\" = \"1\" ]; then python manage.py seed_initial_data; fi
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

