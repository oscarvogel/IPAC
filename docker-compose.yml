services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ipac
      POSTGRES_USER: ipac
      POSTGRES_PASSWORD: ipac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipac -d ipac"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DJANGO_DEBUG: "0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
      DATABASE_URL: "postgres://ipac:ipac@db:5432/ipac"
      IPAC_SEED_ADMIN_USERNAME: "admin"
      IPAC_SEED_ADMIN_PASSWORD: "admin123"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate
      && python manage.py seed_initial_data
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  media_data:
