name: Chatbot PR CI

on:
  push:
    branches:
      - feat/ipac-chatbot-operativo
      - feat/ipac-chatbot-fase-2
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Django checks
        run: python backend/manage.py check

      - name: Migration consistency
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Phase 2 focused backend tests
        run: |
          python backend/manage.py test core.test_asistente_fase2_models
          python backend/manage.py test core.test_chatbot_assistant
          if [ -f backend/core/test_asistente_tools.py ]; then python backend/manage.py test core.test_asistente_tools; fi
          if [ -f backend/core/test_asistente_orchestrator.py ]; then python backend/manage.py test core.test_asistente_orchestrator; fi
          if [ -f backend/core/test_asistente_admin_api.py ]; then python backend/manage.py test core.test_asistente_admin_api; fi
          if [ -f backend/core/test_asistente_notifications.py ]; then python backend/manage.py test core.test_asistente_notifications; fi

      - name: Backend tests
        run: python backend/manage.py test core

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend build
        run: npm --prefix frontend run build
